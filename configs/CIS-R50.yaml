MODEL:
  BACKBONE:
    FREEZE_AT: 0
    NAME: "build_resnet_backbone"
  WEIGHTS: "detectron2://ImageNetPretrained/torchvision/R-50.pkl"
  RESNETS:
    DEPTH: 50
    STEM_TYPE: "basic"  # not used
    STEM_OUT_CHANNELS: 64
    STRIDE_IN_1X1: False
    OUT_FEATURES: ["res2", "res3", "res4", "res5"]
  META_ARCHITECTURE: "DCNet"
  SEM_SEG_HEAD:
    IN_FEATURES: ["res2", "res3", "res4", "res5"]
  DCNET:
    DEEP_SUPERVISION: True
    CLASS_WEIGHT: 1.0
    DICE_WEIGHT: 1.0
    MASK_WEIGHT: 20.0
    # gollum-v4 train max instances/image = 8
    NUM_OBJECT_QUERIES: 20
    DEC_LAYERS: 6
DATASETS:
  TRAIN: ("gollum_train",)
  TEST: ("gollum_val",)
SOLVER:
  IMS_PER_BATCH: 16
  BASE_LR: 0.0001
  STEPS: (72000, 84000)
  MAX_ITER: 90000
  WARMUP_FACTOR: 0.001
  WARMUP_ITERS: 200
  WEIGHT_DECAY: 0.05
  OPTIMIZER: "ADAMW"
  BACKBONE_MULTIPLIER: 0.1
  CHECKPOINT_PERIOD: 10000
  AMP:
    ENABLED: False
INPUT:
  IMAGE_SIZE: 448
  # Images are already 448x448 tiles from tools/tile_dataset.py, with ~30% of
  # instances already truncated at a tile edge. The old 0.8-1.2 LSJ-style
  # jitter (tuned for full-res, uncut frames) would zoom in and randomly
  # crop up to ~17% more off an already-cropped tile, frequently cutting the
  # remaining instance out entirely -- eval uses scale=1 (no crop), so this
  # mismatch was starving training of consistent supervision. Keep jitter
  # mild so it doesn't compete with the tiling itself.
  MIN_SCALE: 0.95
  MAX_SCALE: 1.05
  FORMAT: "RGB"
TEST:
  EVAL_PERIOD: 2500
  DETECTIONS_PER_IMAGE: 20
DATALOADER:
  FILTER_EMPTY_ANNOTATIONS: True
  NUM_WORKERS: 8
OUTPUT_DIR: output
